<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuniTube</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #0f0f0f; color: #fff; padding-bottom: 50px; }
        
        header { display: flex; align-items: center; padding: 15px 20px; background-color: #0f0f0f; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .logo-section { display: flex; align-items: center; gap: 10px; }
        .yt-logo { width: 35px; height: 35px; background: #ff0000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 20px; }
        .brand-name { font-size: 22px; font-weight: bold; letter-spacing: -0.5px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        
        /* ইউটিউব অফিশিয়াল প্লেয়ার এরিয়া */
        .player-wrapper { width: 100%; max-width: 800px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; display: none; }
        .iframe-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .video-details { padding: 15px; background: #1f1f1f; }
        .video-title { font-size: 18px; font-weight: bold; }
        
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 10px; }
        .video-card { cursor: pointer; background: #171717; border-radius: 12px; overflow: hidden; position: relative; }
        .thumbnail-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #222; }
        .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 12px; }
        .card-title { font-size: 14px; font-weight: bold; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        #loadingStatus { text-align: center; color: #aaa; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <div class="yt-logo">▶</div>
            <div class="brand-name">ZuniTube</div>
        </div>
    </header>

    <div class="container">
        <!-- আসল ইউটিউব প্লেয়ার সেকশন -->
        <div class="player-wrapper" id="playerContainer">
            <div class="iframe-container">
                <iframe id="youtubeIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <div class="video-details">
                <div class="video-title" id="currentTitle">ভিডিওর নাম লোড হচ্ছে...</div>
            </div>
        </div>

        <h2>All Recommended Videos</h2>
        <div id="loadingStatus">ZuniTube থেকে ভিডিও লোড হচ্ছে... ⏳</div>
        <div class="video-grid" id="videoFeed"></div>
    </div>

    <script>
        // আপনার Cloudflare Worker-এর ইউআরএল
        const WORKER_API_URL = "https://workers.dev"; 

        let globalVideoList = [];

        // ১. ভিডিওর লিস্ট পেজ লোড হলেই এলোমেলো (Shuffle) করার লজিক
        function shuffle(array) {
            return array.sort(function() { return Math.random() - 0.5; });
        }

        // ২. কোনো এপিআই কি (API Key) ছাড়া ইউটিউব আইডি থেকে টাইটেল নিয়ে আসার নিয়ম
        async function fetchYouTubeTitle(videoId) {
            try {
                const res = await fetch(`https://noembed.com{videoId}`);
                const json = await res.json();
                return json.title || "ZuniTube Cartoon Video";
            } catch (err) {
                return "ZuniTube Cartoon Video";
            }
        }

        // ৩. ডাটাবেজ থেকে শুধু আইডি এনে হোম পেজ সাজানো
        async function loadAndRender() {
            const feedContainer = document.getElementById("videoFeed");
            const loadingText = document.getElementById("loadingStatus");
            
            try {
                const response = await fetch(WORKER_API_URL);
                globalVideoList = await response.json(); // আপনার D1 থেকে শুধু আইডি'র লিস্ট আসবে
                loadingText.style.display = "none";
            } catch (err) {
                loadingText.innerText = "ভিডিও লোড করতে সমস্যা হয়েছে! ইন্টারনেট চেক করুন।";
                return;
            }

            // ভিডিওর লিস্ট পুরোপুরি সাফেল (Shuffle) করা হলো
            const shuffledVideos = shuffle([...globalVideoList]);
            feedContainer.innerHTML = "";

            // প্রতিটি আইডির জন্য লুপ চালিয়ে থাম্বনেইল এবং টাইটেল তৈরি
            shuffledVideos.forEach(function(video) {
                // আইডি থেকে সরাসরি স্ট্যান্ডার্ড সলিড থাম্বনেইল লিঙ্ক (১০০% ছবি আসবেই)
                const thumbUrl = `https://youtube.com{video.id}/hqdefault.jpg`;
                
                const card = document.createElement("div");
                card.className = "video-card";
                card.onclick = function() { playVideo(video); };

                card.innerHTML = `
                    <div class="thumbnail-box">
                        <img src="${thumbUrl}" alt="thumbnail">
                    </div>
                    <div class="card-info">
                        <div class="card-title" id="title-${video.id}">Loading Title...</div>
                    </div>
                `;
                
                feedContainer.appendChild(card);

                // নো-এপিআই মেথড দিয়ে ব্যাকগ্রাউন্ডে আসল নাম এনে টেক্সট বসানো
                fetchYouTubeTitle(video.id).then(title => {
                    video.title = title; // প্লেয়ারের জন্য অবজেক্টে নাম সেভ রাখা
                    const titleElement = document.getElementById(`title-${video.id}`);
                    if (titleElement) titleElement.innerText = title;
                });
            });
        }

        // ৪. ভিডিওতে ক্লিক করলে আসল ইউটিউব প্লেয়ারে চালু হওয়ার লজিক
        function playVideo(video) {
            document.getElementById("playerContainer").style.display = "block";
            document.getElementById("currentTitle").innerText = video.title || "Playing YouTube Video...";
            
            // আসল ইউটিউব এমবেড লিঙ্ক প্লেয়ারে পুশ করা হলো (অটো প্লে সহ)
            const iframe = document.getElementById("youtubeIframe");
            iframe.src = `https://youtube.com{video.id}?autoplay=1&modestbranding=1&rel=0`;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // পেজ লোড হলেই রান হবে
        loadAndRender();
    </script>
</body>
</html>
