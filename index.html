<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuniTube</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #0f0f0f; color: #fff; padding-bottom: 50px; }
        
        header { display: flex; align-items: center; padding: 15px 20px; background-color: #0f0f0f; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .logo-section { display: flex; align-items: center; gap: 10px; }
        .yt-logo { width: 35px; height: 35px; background: #ff0000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 20px; }
        .brand-name { font-size: 22px; font-weight: bold; letter-spacing: -0.5px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        
        .player-wrapper { width: 100%; max-width: 800px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; display: none; }
        video { width: 100%; display: block; aspect-ratio: 16/9; }
        .video-details { padding: 15px; background: #1f1f1f; }
        .video-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .action-btns { display: flex; gap: 10px; }
        .btn { background: #272727; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-download { background: #fff; color: #000; }
        
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 10px; }
        .video-card { cursor: pointer; background: #171717; border-radius: 12px; overflow: hidden; position: relative; }
        .thumbnail-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #222; }
        .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }
        .offline-badge { position: absolute; top: 10px; left: 10px; background: #00b0ff; color: #000; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .card-info { padding: 12px; }
        .card-title { font-size: 14px; font-weight: bold; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        #loadingStatus { text-align: center; color: #aaa; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <div class="yt-logo">▶</div>
            <div class="brand-name">ZuniTube</div>
        </div>
    </header>

    <div class="container">
        <!-- ভিডিও প্লেয়ার সেকশন -->
        <div class="player-wrapper" id="playerContainer">
            <video id="mainPlayer" controls autoplay></video>
            <div class="video-details">
                <div class="video-title" id="currentTitle">ভিডিওর নাম</div>
                <div class="action-btns">
                    <button class="btn btn-download" id="dlBtn">⬇ Download</button>
                    <button class="btn" id="delBtn" style="background:#cc0000; display:none;">🗑 Delete</button>
                </div>
            </div>
        </div>

        <h2>All Recommended Videos</h2>
        <div id="loadingStatus">Loading videos... ⏳</div>
        <div class="video-grid" id="videoFeed"></div>
    </div>

    <script>
        // আপনার নতুন তৈরি করা Cloudflare Worker-এর URL টি এখানে বসাবেন
        const WORKER_API_URL = "https://workers.dev"; 

        let db;
        let currentVideo = null;
        let globalVideoList = [];

        // ১. IndexedDB (অফলাইন স্টোরেজ) ওপেন করা
        const dbRequest = indexedDB.open("ZuniTubeDB", 1);
        dbRequest.onupgradeneeded = function(e) {
            db = e.target.result;
            db.createObjectStore("offline_videos", { keyPath: "id" });
        };
        dbRequest.onsuccess = function(e) {
            db = e.target.result;
            loadAndRender(); 
        };

        // ২. ভিডিও লিস্ট এলোমেলো (Shuffle) করার লজিক
        function shuffle(array) {
            return array.sort(function() { return Math.random() - 0.5; });
        }

        // ৩. ওয়ার্কার বা অফলাইন থেকে ডেটা এনে পেজে দেখানো
        async function loadAndRender() {
            const feedContainer = document.getElementById("videoFeed");
            const loadingText = document.getElementById("loadingStatus");
            
            try {
                const response = await fetch(WORKER_API_URL);
                globalVideoList = await response.json();
                loadingText.style.display = "none";
            } catch (err) {
                console.log("Offline mode active or API error.");
            }

            const tx = db.transaction("offline_videos", "readonly");
            const store = tx.objectStore("offline_videos");
            
            store.getAll().onsuccess = function(e) {
                const downloadedVideos = e.target.result; 
                const downloadedIds = downloadedVideos.map(function(v) { return v.id; });

                if (globalVideoList.length === 0) {
                    globalVideoList = downloadedVideos.map(function(v) {
                        return {
                            id: v.id,
                            title: "Offline Video (" + v.id + ")", 
                            url: "",
                            thumb: "https://icons8.com"
                        };
                    });
                    loadingText.style.display = "none";
                }

                const shuffledVideos = shuffle([...globalVideoList]);
                feedContainer.innerHTML = "";

                shuffledVideos.forEach(function(video) {
                    const isDownloaded = downloadedIds.includes(video.id);
                    const card = document.createElement("div");
                    card.className = "video-card";
                    card.onclick = function() { playVideo(video); };

                    let badgeHTML = "";
                    if (isDownloaded) {
                        badgeHTML = '<div class="offline-badge">⬇ Saved</div>';
                    }

                    card.innerHTML = `
                        <div class="thumbnail-box">
                            <img src="${video.thumb}">
                            ${badgeHTML}
                        </div>
                        <div class="card-info">
                            <div class="card-title">${video.title}</div>
                        </div>
                    `;
                    feedContainer.appendChild(card);
                });
            };
        }

        // ৪. ভিডিও প্লে করার লজিক
        function playVideo(video) {
            currentVideo = video;
            document.getElementById("playerContainer").style.display = "block";
            document.getElementById("currentTitle").innerText = video.title;
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const tx = db.transaction("offline_videos", "readonly");
            const store = tx.objectStore("offline_videos");
            const getReq = store.get(video.id);

            getReq.onsuccess = function() {
                const player = document.getElementById("mainPlayer");
                if (getReq.result) {
                    const blobUrl = URL.createObjectURL(getReq.result.blobData);
                    player.src = blobUrl;
                    document.getElementById("dlBtn").innerText = "✔ Downloaded";
                    document.getElementById("delBtn").style.display = "inline-block";
                } else {
                    player.src = video.url;
                    document.getElementById("dlBtn").innerText = "⬇ Download";
                    document.getElementById("delBtn").style.display = "none";
                }
            };
        }

        // ৫. ডাউনলোড লজিক
        document.getElementById("dlBtn").addEventListener("click", async function() {
            if (!currentVideo) return;
            const btn = document.getElementById("dlBtn");
            btn.innerText = "Downloading... ⏳";

            try {
                const response = await fetch(currentVideo.url);
                const blob = await response.blob();

                const tx = db.transaction("offline_videos", "readwrite");
                const store = tx.objectStore("offline_videos");
                store.put({ id: currentVideo.id, blobData: blob });

                tx.oncomplete = function() {
                    btn.innerText = "✔ Downloaded";
                    document.getElementById("delBtn").style.display = "inline-block";
                    loadAndRender(); 
                };
            } catch (err) {
                alert("Download failed. Direct file link might be blocked or expired.");
                btn.innerText = "⬇ Download";
            }
        });

        // ৬. ডিলিট লজিক
        document.getElementById("delBtn").addEventListener("click", function() {
            if (!currentVideo) return;
            const tx = db.transaction("offline_videos", "readwrite");
            const store = tx.objectStore("offline_videos");
            store.delete(currentVideo.id);

            tx.oncomplete = function() {
                document.getElementById("mainPlayer").src = currentVideo.url;
                document.getElementById("dlBtn").innerText = "⬇ Download";
                document.getElementById("delBtn").style.display = "none";
                loadAndRender();
            };
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
