name: Sync YouTube Videos to Cloudflare D1

on:
  schedule:
    - cron: '0 */12 * * *' # প্রতি ১২ ঘণ্টায় অটোমেটিক চলবে
  workflow_dispatch: # চাইলে আপনি নিজেও বাটন চেপে যেকোনো সময় রান করতে পারবেন

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Fetch RSS and Push to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          async function start() {
            const channels = JSON.parse(fs.readFileSync("channels.json", "utf8"));
            console.log("Found channels:", channels.length);

            for (const channelId of channels) {
              try {
                // কোনো API Key ছাড়াই RSS দিয়ে চ্যানেলের সর্বশেষ ভিডিওগুলো স্ক্র্যাপ করা হচ্ছে
                const res = await fetch(`https://youtube.com/{channelId}`);
                const text = await res.text();
                
                // XML থেকে Video ID এবং Title খুঁজে বের করার সহজ লজিক
                const videoIds = [...text.matchAll(/<yt:videoId>(.*?)<\/yt:videoId>/g)].map(m => m[1]);
                const titles = [...text.matchAll(/<title>(.*?)<\/title>/g)].map(m => m[1]).slice(1); // প্রথম টাইটেলটি চ্যানেলের নাম, তাই বাদ

                for (let i = 0; i < videoIds.length; i++) {
                  const id = videoIds[i];
                  const title = titles[i].replace(/'/g, "´´"); // SQL error এড়ানোর জন্য
                  const url = `https://youtube.com{id}`; // বা আপনার প্রক্সি/R2 ডাউনলোড লিঙ্ক
                  const thumb = `https://youtube.com{id}/maxresdefault.jpg`;

                  console.log(`Saving: ${title}`);
                  
                  // সরাসরি Cloudflare D1 ডাটাবেজে ডেটা পুশ করার কমান্ড
                  const sql = `INSERT OR IGNORE INTO videos (id, title, url, thumb) VALUES ("${id}", "${title}", "${url}", "${thumb}");`;
                  execSync(`wrangler d1 execute zunitube-db --remote --command="${sql}"`, { stdio: "inherit" });
                }
              } catch (err) {
                console.error("Error processing channel:", channelId, err.message);
              }
            }
          }
          start();
          '
